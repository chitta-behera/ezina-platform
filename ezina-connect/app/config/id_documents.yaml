# Identity document types per country (ISO 3166-1 alpha-2).
#   code   stored on identity_documents.id_document_type
#   names  display name per language; "en" is the fallback
#   back   kept for future use; Ezina currently asks for the FRONT only (all false)
#   mask   show masking instructions (Aadhaar: cover the first 8 digits)
# Ezina never asks for, stores or repeats an ID number.
#
# extraction: the ID name check (ezina_id_verify, AWS Rekognition), keyed by ID type code.
#   verify_doc_type  the doc_type passed to ezina_id_verify.extract_name(): one of the types in that package's
#                    documents.yaml (passport, aadhaar, pan, voter_id, driving_licence, botswana_omang, kenya_id, ...)
# An ID type with no entry here is not checked (name check SKIPPED, extract_name is not called), e.g. KCC. To add one,
# add an entry: no code change. A verify_doc_type the package does not know is also SKIPPED at run time.
# The file is validated at startup; a malformed file stops the app with a clear message.
extraction:
  PASSPORT:
    verify_doc_type: "passport"
  AADHAAR_MASKED:
    verify_doc_type: "aadhaar"
  PAN:
    verify_doc_type: "pan"
  VOTER_ID:
    verify_doc_type: "voter_id"
  DRIVING_LICENCE:
    verify_doc_type: "driving_licence"
  OMANG:
    verify_doc_type: "botswana_omang"

countries:
  IN:
    types:
      - {code: AADHAAR_MASKED, names: {en: "Aadhaar (masked)"}, back: false, mask: true}
      - {code: VOTER_ID, names: {en: "Voter ID / EPIC"}, back: false, mask: false}
      - {code: PAN, names: {en: "PAN card"}, back: false, mask: false}
      - {code: KCC, names: {en: "Kisan Credit Card"}, back: false, mask: false}
      - {code: DRIVING_LICENCE, names: {en: "Driving licence"}, back: false, mask: false}
  BW:
    types:
      - {code: OMANG, names: {en: "Omang"}, back: false, mask: false}
      - {code: PASSPORT, names: {en: "Passport"}, back: false, mask: false}
      - {code: DRIVING_LICENCE, names: {en: "Driving licence"}, back: false, mask: false}
